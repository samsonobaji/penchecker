<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="penchecker-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#00ff87" />
    </linearGradient>
    <filter id="penchecker-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Shield Grid (representing security) -->
  <path d="M50 12 L82 22 V52 C82 70 68 83 50 88 C32 83 18 70 18 52 V22 Z" 
        fill="none" 
        stroke="url(#penchecker-grad)" 
        stroke-width="3" 
        stroke-linejoin="round" 
        filter="url(#penchecker-glow)" />
        
  <!-- Radar Sweep Lines (representing scanning/checking) -->
  <path d="M30 40 A 24 24 0 0 1 70 40" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.8" />
  <path d="M36 48 A 16 16 0 0 1 64 48" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.6" />
  
  <!-- Stylized Pen Nib / Cyber Arrow pointing down (representing penetration testing) -->
  <path d="M50 28 L62 54 L50 72 L38 54 Z" fill="url(#penchecker-grad)" />
  
  <!-- Inner Detail of the Nib / Split Line -->
  <line x1="50" y1="38" x2="50" y2="60" stroke="#060608" stroke-width="2" stroke-linecap="round" />
  
  <!-- Glowing Target Node / Scan Indicator -->
  <circle cx="50" cy="34" r="2.5" fill="#00ff87" filter="url(#penchecker-glow)" />
</svg>
